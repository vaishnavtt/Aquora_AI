# AQUORA AI — Root Alembic Configuration
# Allows running migration commands directly from the project root directory
# (e.g. `python -m alembic current` or `alembic upgrade head`)

[alembic]
script_location = %(here)s/backend/alembic
prepend_sys_path = backend
path_separator = os
sqlalchemy.url = driver://user:pass@localhost/dbname
